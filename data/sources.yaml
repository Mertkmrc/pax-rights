# Corpus sources. Raw files are downloaded to data/raw/ and never committed.
# fetch: auto   -> scripts/fetch_corpus.py downloads it
# fetch: manual -> the site blocks automated downloads; save it from a browser to data/raw/<id>.<format>
#
# kind: airline | regulation
# jurisdiction: EU | TR (for airlines, the carrier's home jurisdiction; matters for EU261 Art. 3)

sources:
