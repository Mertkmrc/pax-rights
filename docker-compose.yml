services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pax
      POSTGRES_PASSWORD: pax
      POSTGRES_DB: pax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pax -d pax"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
