[project]
name = "pax-rights"
version = "0.1.0"
description = "Airline passenger-rights and fare-rules assistant that answers with citations"
readme = "README.md"
authors = [
    { name = "MertKmrc", email = "mert.kmrcoglu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
